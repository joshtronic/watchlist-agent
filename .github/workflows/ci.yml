name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated types are up to date
        run: npm run types -- --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTH_URL: https://watchlist.fetchlogic.com/api/health
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run deploy
      # The first deploy also provisions the custom domain and its
      # certificate, which can take a few minutes.
      - name: Production reports this commit
        run: |
          for attempt in $(seq 1 40); do
            commit=$(curl -fsS "$HEALTH_URL" | jq -r .commit || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Deployed $commit"
              exit 0
            fi
            echo "Attempt $attempt: saw '${commit}', want '$GITHUB_SHA'"
            sleep 15
          done
          exit 1
